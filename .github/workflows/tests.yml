---
name: Unit Tests

on:
  workflow_call:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies and development tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make dev-tools
          go mod download

      - name: Verify module manifests
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format, lint and race-test
        run: make verify

      - name: Build Hookglass
        run: make build

      - uses: ./.github/actions/setup-goreleaser

      - name: Check GoReleaser configuration
        run: goreleaser check
